---
apiVersion: v1
kind: Namespace
metadata:
  name: ashish-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ashish
  namespace: ashish-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ashish-role
  namespace: ashish-workspace
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ashish-rolebinding
  namespace: ashish-workspace
subjects:
- kind: ServiceAccount
  name: ashish
  namespace: ashish-workspace
roleRef:
  kind: Role
  name: ashish-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: ashish-secret
  namespace: ashish-workspace
  annotations:
    kubernetes.io/service-account.name: ashish
type: kubernetes.io/service-account-token