openapi: 3.0.0
info:
  title: Stackdome Stackfile Schema
  version: 1.0.0
  description: >
    Schema for the Stackdome stackfile format. A stackfile is a developer-friendly
    YAML manifest that defines a stack (multi-service deployment) for the Stackdome
    platform. The CLI parses stackfiles and converts them into the Stack API format.

components:
  schemas:
    Stackfile:
      type: object
      required:
        - name
        - resources
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Stack name. Must be unique within the team/project.
          example: infisical
        resources:
          type: object
          description: >
            Map of resource name to resource definition. Each resource is a
            containerized service within the stack. At least one resource is required.
          additionalProperties:
            $ref: '#/components/schemas/Resource'
          minProperties: 1
        volumes:
          type: object
          description: >
            Map of volume name to volume definition. Volumes provide persistent
            storage that can be mounted into resources.
          additionalProperties:
            $ref: '#/components/schemas/VolumeDef'

    Resource:
      type: object
      description: >
        A containerized service within the stack. Must have either `image` (pre-built
        container image) or `build` (build from source), but not both.

        Mutual exclusion: exactly one of `image` or `build` must be provided.
        This is enforced via oneOf with two variants.
      additionalProperties: false
      oneOf:
        - required: [image]
          not:
            required: [build]
        - required: [build]
          not:
            required: [image]
      properties:
        image:
          type: string
          minLength: 1
          description: Container image reference. Mutually exclusive with `build`.
          example: postgres:14-alpine
        build:
          $ref: '#/components/schemas/BuildConfig'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortDef'
        env:
          type: object
          description: >
            Environment variables for the resource. Values can be:

            - Literal strings: `KEY: "value"`
            - Self output references: `KEY: "{{ self.<output> }}"` — reads from this resource's own outputs
            - Resource references: `KEY: "{{ <resource>.<output> }}"` — reads from another resource's outputs, auto-generates a connection
            - Embedded templates: `KEY: "postgres://user:pass@{{ db.host }}:5432/mydb"` — generates a template connection

            Available stack resource outputs:
            - `host` — internal service hostname
            - `port.<port-name>` — port number (e.g., `port.postgres`)
            - `url.<port-name>` — internal URL
            - `public.<port-name>.host` — public hostname (only if port is public)
            - `public.<port-name>.url` — public URL (only if port is public)
          additionalProperties:
            type: string
        secrets:
          type: object
          description: >
            Map of secret name to env var mappings. Each key is a Stackdome secret
            name, and the value maps environment variable names to secret keys.
            The CLI resolves secret names to IDs at deploy time.
          additionalProperties:
            $ref: '#/components/schemas/SecretMapping'
        addons:
          type: object
          description: >
            Map of addon name to connection config. Each key is a Stackdome addon
            name, and the value configures how the addon's outputs are injected.
            The CLI resolves addon names to IDs at deploy time.
          additionalProperties:
            $ref: '#/components/schemas/AddonConnectionConfig'
        volumes:
          type: array
          description: Volumes to mount into this resource. Each referenced volume must be defined in the top-level `volumes` section.
          items:
            $ref: '#/components/schemas/VolumeMountDef'
        depends_on:
          type: array
          description: List of resource names this resource depends on for startup ordering.
          items:
            type: string
            minLength: 1
        stateful:
          type: boolean
          description: Mark this resource as stateful (e.g., databases). Default false.
          default: false

    BuildConfig:
      type: object
      description: >
        Build a container image from source. Mutually exclusive with `image`.

        Revision: at most one of `branch`, `tag`, or `commit` may be specified.
        If none is set, defaults to branch "main".
      required:
        - repo
      additionalProperties: false
      properties:
        repo:
          type: string
          minLength: 1
          description: Git repository URL.
          example: https://github.com/myorg/myapp.git
        branch:
          type: string
          minLength: 1
          description: Git branch to build from. Mutually exclusive with `tag` and `commit`. Default "main".
          example: main
        tag:
          type: string
          minLength: 1
          description: Git tag to build from. Mutually exclusive with `branch` and `commit`.
          example: v1.0.0
        commit:
          type: string
          minLength: 1
          description: Git commit SHA to build from. Mutually exclusive with `branch` and `tag`.
        dockerfile:
          type: string
          minLength: 1
          description: Path to Dockerfile relative to context. Default "Dockerfile".
          default: Dockerfile
        context:
          type: string
          minLength: 1
          description: Build context path within the repository. Default ".".
          default: "."
      # At most one of branch, tag, commit. OpenAPI 3.0 cannot express
      # "at most one of" directly; validated in code.

    PortDef:
      type: object
      required:
        - name
        - port
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: >
            Port name. Used in output accessors (e.g., a port named "http" produces
            outputs `port.http`, `url.http`, and if public, `public.http.url`).
          example: http
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port number.
          example: 8080
        protocol:
          type: string
          description: Protocol. Default "HTTP".
          enum:
            - HTTP
            - TCP
          default: HTTP
        public:
          type: boolean
          description: Expose this port publicly via ingress. Default false.
          default: false
        subdomain:
          type: string
          minLength: 1
          description: Subdomain prefix for the public URL. Only applicable when `public` is true.
          example: api

    VolumeDef:
      type: object
      required:
        - size
      additionalProperties: false
      properties:
        size:
          type: string
          minLength: 1
          pattern: '^\d+(Ki|Mi|Gi|Ti|Pi|Ei)?$'
          description: >
            Volume size in Kubernetes resource quantity format (e.g., "1Gi", "500Mi", "10Gi").
          example: 5Gi
        access_mode:
          type: string
          description: Volume access mode. Default "ReadWriteOnce".
          enum:
            - ReadWriteOnce
            - ReadWriteMany
            - ReadOnlyMany
          default: ReadWriteOnce

    VolumeMountDef:
      type: object
      required:
        - name
        - path
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Name of a volume defined in the top-level `volumes` section.
        path:
          type: string
          minLength: 1
          pattern: '^/'
          description: Absolute path where the volume is mounted in the container.
          example: /var/lib/postgresql/data

    SecretMapping:
      type: object
      description: >
        Maps environment variable names to secret keys. Each key is the env var
        name to set, and each value is the key within the Stackdome secret.
      additionalProperties:
        type: string
        minLength: 1
      minProperties: 1
      example:
        API_KEY: api_key
        API_SECRET: api_secret

    AddonConnectionConfig:
      type: object
      required:
        - type
        - env
      additionalProperties: false
      description: >
        Connection config for an addon. The `type` field determines which
        addon-specific fields are available.
      properties:
        type:
          type: string
          description: Addon type.
          enum:
            - postgres
        env:
          type: object
          description: >
            Maps environment variable names to addon output accessors or templates.

            For postgres addons, available outputs are:
            `host`, `port`, `database`, `username`, `password`, `sslmode`,
            `ca_certificate`, `url`.

            Values can be:
            - Direct output: `DB_HOST: host`
            - Template: `DATABASE_URL: "postgres://{{ username }}:{{ password }}@{{ host }}:{{ port }}/{{ database }}"`
          additionalProperties:
            type: string
          minProperties: 1
        database:
          type: string
          minLength: 1
          description: Target database name within the postgres addon.
        superuser:
          type: boolean
          description: Use superuser credentials. Default false.
          default: false
