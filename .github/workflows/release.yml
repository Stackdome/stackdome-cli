name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build or repair (for example, v0.0.1-alpha)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      tag_ref: ${{ steps.release-tag.outputs.tag_ref }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag must start with 'v' and contain only letters, numbers, dots, underscores, or hyphens: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'tag_ref=refs/tags/%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${RELEASE_TAG}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p package dist
          binary="stackdome"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${version} -X main.GitCommit=${commit} -X main.BuildDate=${build_date}" \
            -o "package/${binary}" ./cmd/stackdome
          cp LICENSE package/LICENSE
          tar -C package -czf "dist/stackdome_${version}_${GOOS}_${GOARCH}.tar.gz" "${binary}" LICENSE

      - name: Verify release metadata
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          expected_commit="$(git rev-parse --short HEAD)"
          version_json="$(./package/stackdome version -o json)"
          jq -e \
            --arg version "${EXPECTED_VERSION}" \
            --arg commit "${expected_commit}" \
            '.version == $version and .commit == $commit and (.built | length > 0)' \
            <<<"${version_json}"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackdome-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stackdome-*
          path: dist
          merge-multiple: true

      - name: Generate checksum manifest
        working-directory: dist
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          expected_archives=(
            "stackdome_${RELEASE_TAG}_darwin_amd64.tar.gz"
            "stackdome_${RELEASE_TAG}_darwin_arm64.tar.gz"
            "stackdome_${RELEASE_TAG}_linux_amd64.tar.gz"
            "stackdome_${RELEASE_TAG}_linux_arm64.tar.gz"
          )
          for archive in "${expected_archives[@]}"; do
            test -f "${archive}" || {
              echo "Missing release archive: ${archive}" >&2
              exit 1
            }
          done
          archive_count="$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "${archive_count}" != "4" ]; then
            echo "Expected exactly 4 release archives, found ${archive_count}" >&2
            exit 1
          fi
          sha256sum "${expected_archives[@]}" > checksums.txt
          checksum_count="$(wc -l < checksums.txt | tr -d ' ')"
          if [ "${checksum_count}" != "4" ]; then
            echo "Expected exactly 4 checksums, found ${checksum_count}" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          expected_assets=(
            "stackdome_${RELEASE_TAG}_darwin_amd64.tar.gz"
            "stackdome_${RELEASE_TAG}_darwin_arm64.tar.gz"
            "stackdome_${RELEASE_TAG}_linux_amd64.tar.gz"
            "stackdome_${RELEASE_TAG}_linux_arm64.tar.gz"
            "checksums.txt"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          else
            gh release create "${RELEASE_TAG}" --draft --verify-tag --generate-notes --title "Stackdome CLI ${RELEASE_TAG}"
            release_is_draft=true
          fi

          while IFS= read -r asset; do
            is_expected=false
            for expected_asset in "${expected_assets[@]}"; do
              if [[ "${asset}" == "${expected_asset}" ]]; then
                is_expected=true
                break
              fi
            done
            if [[ "${is_expected}" == "false" ]]; then
              echo "Removing obsolete release asset: ${asset}"
              gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
            fi
          done < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')

          gh release upload "${RELEASE_TAG}" dist/*.tar.gz --clobber
          gh release upload "${RELEASE_TAG}" dist/checksums.txt --clobber

          mapfile -t actual_assets < <(
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort
          )
          mapfile -t sorted_expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [[ "${actual_assets[*]}" != "${sorted_expected_assets[*]}" ]]; then
            echo "Release assets do not match the Linux/macOS publication contract" >&2
            printf 'Expected: %s\n' "${sorted_expected_assets[*]}" >&2
            printf 'Actual:   %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi

          if [[ "${release_is_draft}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          fi

  publish-installer:
    name: Publish CLI installer
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/publish-cli-installer.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
