name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build or repair (for example, v0.0.1-alpha)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      tag_ref: ${{ steps.release-tag.outputs.tag_ref }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag must start with 'v' and contain only letters, numbers, dots, underscores, or hyphens: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'tag_ref=refs/tags/%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${RELEASE_TAG}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p package dist
          binary="stackdome"
          if [ "${GOOS}" = "windows" ]; then
            binary="stackdome.exe"
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${version} -X main.GitCommit=${commit} -X main.BuildDate=${build_date}" \
            -o "package/${binary}" ./cmd/stackdome
          cp LICENSE package/LICENSE
          if [ "${GOOS}" = "windows" ]; then
            (cd package && zip -q "../dist/stackdome_${version}_${GOOS}_${GOARCH}.zip" "${binary}" LICENSE)
          else
            tar -C package -czf "dist/stackdome_${version}_${GOOS}_${GOARCH}.tar.gz" "${binary}" LICENSE
          fi

      - name: Verify release metadata
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          expected_commit="$(git rev-parse --short HEAD)"
          version_json="$(./package/stackdome version -o json)"
          jq -e \
            --arg version "${EXPECTED_VERSION}" \
            --arg commit "${expected_commit}" \
            '.version == $version and .commit == $commit and (.built | length > 0)' \
            <<<"${version_json}"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackdome-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag_ref }}

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stackdome-*
          path: dist
          merge-multiple: true

      - name: Generate checksum manifest
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          else
            gh release create "${RELEASE_TAG}" --draft --verify-tag --generate-notes --title "Stackdome CLI ${RELEASE_TAG}"
            release_is_draft=true
          fi

          gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip --clobber
          gh release upload "${RELEASE_TAG}" dist/checksums.txt --clobber

          if [[ "${release_is_draft}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          fi
